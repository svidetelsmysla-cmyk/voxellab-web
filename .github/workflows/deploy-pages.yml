name: Deploy VoxelLab Web to Pages

on:
  push:
    branches:
      - main
      - agent/web/voxellab-scene-lab-v2-full-suite-v1
      - agent/web/g4-action-tally-resolved-homogenized-v1
      - r13/action-transport-visualizer-a0-v1
      - r6/web-g4-mr-v2-relational-time-repair
      - r6/operator-audit-a1-governed-playback-v1
      - r6/operator-audit-a1-1-candidate-family-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: voxellab-pages
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Complete deterministic scene suite
        run: pnpm suite
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Production build
        run: pnpm build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke test
        run: pnpm test:e2e

      - name: Record build hash
        id: build_hash
        run: echo "sha256=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxellab-browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment summary
        run: |
          echo "## VoxelLab Web deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build SHA256: \`${{ steps.build_hash.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
