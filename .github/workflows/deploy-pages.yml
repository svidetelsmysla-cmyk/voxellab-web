name: Deploy VoxelLab Web to Pages

on:
  push:
    branches: [main, agent/web/voxellab-scene-lab-v2-full-suite-v1, agent/web/g4-action-tally-resolved-homogenized-v1, r13/action-transport-visualizer-a0-v1, r13/action-transport-visualizer-a0-2-v1, r13/action-transport-visualizer-a0-3-v1, r13/action-transport-visualizer-a1-v1, r13/action-transport-visualizer-a2-overlap-v1, r13/action-transport-visualizer-a2b-free-boundary-v1, r13/d0s-static-microbody-representation-parity-v1, r13/c1-cavity-w-maps-v1, r13/c0c1-cavity-relaxation-boundary-v1, r6/action-lab-a3-first-hit-continuous-column-v1, r14/a4-v14-continuous-field-action-bridge-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: voxellab-pages
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: A4 continuous-field action bridge method gate
        run: |
          pnpm a4:build
          node .a4-build/runContinuousFieldActionBridgeGate.js | tee a4-continuous-field-action-bridge-summary.json

      - name: Upload A4 method evidence
        uses: actions/upload-artifact@v4
        with:
          name: a4-continuous-field-action-bridge-evidence-${{ github.sha }}
          path: a4-continuous-field-action-bridge-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Generated cavity relaxation gate
        run: |
          pnpm cavity:build
          node .cavity-build/runCavityRelaxationGate.js | tee cavity-relaxation-summary.json

      - name: Upload cavity relaxation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cavity-relaxation-evidence-${{ github.sha }}
          path: cavity-relaxation-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Complete deterministic scene suite
        run: pnpm suite
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Production build
        run: pnpm build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke test
        run: pnpm test:e2e

      - name: Record build hash
        id: build_hash
        run: echo "sha256=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxellab-browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Publish deployment summary
        run: |
          echo "## VoxelLab Web deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- A4 verdict: \`A4_METHOD_BRIDGE_IMPLEMENTED_V14_SNAPSHOT_EXPORT_BLOCKER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build SHA256: \`${{ steps.build_hash.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
